name: Release

# Publier une version : mettre à jour « Version » (lwb-migration.php), LWB_MIGRATION_VERSION,
# « Stable tag » et le Changelog de readme.txt, puis AU CHOIX :
#   - git tag v1.2.0 && git push origin v1.2.0
#   - ou GitHub › Actions › Release › « Run workflow » (le tag est créé automatiquement).
# La release GitHub (zip + latest.json) est publiée. La page https://lewebmax.com/lwb-migration/
# et tous les sites équipés de l'extension la voient aussitôt.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LWB_TEST_DB_HOST: 127.0.0.1
      LWB_TEST_DB_USER: root
      LWB_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, zlib
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpcs -q
      - run: vendor/bin/phpunit
        timeout-minutes: 5

  release:
    name: Publication
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - name: Version à publier
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' lwb-migration.php | tr -d '[:space:]')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::La release $TAG existe déjà : augmentez la version de l'extension."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Construction du zip
        run: php bin/build.php
      - name: Manifeste latest.json (vérifie aussi que le tag correspond à la version)
        run: php bin/manifest.php "${{ steps.v.outputs.tag }}"
      - name: Création de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" dist/lwb-migration.zip dist/latest.json \
            --target "$GITHUB_SHA" \
            --title "Lwb Migration ${TAG#v}" \
            --notes-file dist/notes.md \
            --latest
