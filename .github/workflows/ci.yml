name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LWB_TEST_DB_HOST: 127.0.0.1
      LWB_TEST_DB_USER: root
      LWB_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, zlib, sodium
          coverage: none
          tools: cs2pr
      - run: composer install --no-interaction --no-progress
      - name: Standards WordPress + compatibilité PHP 7.4–8.4
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
      - name: Tests unitaires
        run: vendor/bin/phpunit
        timeout-minutes: 5
